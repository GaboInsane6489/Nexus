# ==============================================================================
# Nexus Platform — Docker Compose Stack
# Optimized for 16 GB DDR3 / 20+ concurrent users
#
# Base stack:    docker compose --env-file .env.docker up -d --build
# Scale profile: docker compose --env-file .env.docker --profile scale up -d
# Tunnel:        docker compose --env-file .env.docker --profile tunnel up -d
# ==============================================================================

services:
  nexus-nginx:
    image: nginx:1.27-alpine
    container_name: nexus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      nexus-app:
        condition: service_healthy
      nexus-n8n:
        condition: service_started
    mem_limit: 128m
    networks:
      - nexus_net

  nexus-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
    container_name: nexus-app
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    mem_limit: 512m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - nexus_net

  nexus-n8n-db:
    image: postgres:17-alpine
    container_name: nexus-n8n-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:-n8n_change_me}
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
    volumes:
      - n8n_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-n8n-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n} -d ${N8N_DB_NAME:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexus_net

  nexus-n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: nexus-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - path: .env.docker
        required: false
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: nexus-n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n_change_me}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost/}
      NODE_FUNCTION_ALLOW_EXTERNAL: crypto,luxon
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_SECURE_COOKIE: "false"
      NODE_OPTIONS: "--max-old-space-size=768"
    volumes:
      - n8n_data:/home/node/.n8n
    mem_limit: 1024m
    depends_on:
      nexus-n8n-db:
        condition: service_healthy
    networks:
      - nexus_net

  # ----------------------------------------------------------------------------
  # Profile: scale (Redis + n8n queue worker for high-concurrency workflows)
  # ----------------------------------------------------------------------------
  nexus-redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    profiles:
      - scale
    volumes:
      - redis_data:/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - nexus_net

  nexus-n8n-worker:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: nexus-n8n-worker
    restart: unless-stopped
    profiles:
      - scale
    command: worker
    env_file:
      - path: .env.docker
        required: false
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: nexus-n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n_change_me}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: nexus-redis
      QUEUE_BULL_REDIS_PORT: 6379
      NODE_FUNCTION_ALLOW_EXTERNAL: crypto,luxon
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    mem_limit: 512m
    depends_on:
      nexus-redis:
        condition: service_healthy
      nexus-n8n-db:
        condition: service_healthy
    networks:
      - nexus_net

  # ----------------------------------------------------------------------------
  # Profile: tunnel (Cloudflare Zero Trust Tunnel)
  # ----------------------------------------------------------------------------
  nexus-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: nexus-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      nexus-nginx:
        condition: service_started
    mem_limit: 128m
    networks:
      - nexus_net

networks:
  nexus_net:
    driver: bridge

volumes:
  n8n_pgdata:
  n8n_data:
  redis_data:
